name: RepeatZero CI

on:
  push:
    branches:
      - repeatzero-ci
    paths:
      - 'repeatzero/**'
      - '.github/workflows/repeatzero-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and package RepeatZero
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct exact RepeatZero ZIP
        run: |
          set -euo pipefail
          cat \
            repeatzero/chunk_00.b64 \
            repeatzero/chunk_01.b64 \
            repeatzero/chunk_02.b64 \
            repeatzero/chunk_03.b64 \
            repeatzero/chunk_04.b64 \
            repeatzero/chunk_05_0.b64 \
            repeatzero/chunk_05_1.b64 \
            repeatzero/chunk_05_2.b64 \
            repeatzero/chunk_05_3.b64 \
            repeatzero/chunk_05_4.b64 \
            repeatzero/chunk_06.b64 > /tmp/repeatzero.b64
          echo "245f7805b17bf193966c324cfd50da84868ec9383be72800a21cf958c4cb6988  /tmp/repeatzero.b64" | sha256sum -c -
          base64 -d /tmp/repeatzero.b64 > /tmp/repeatzero.zip
          echo "2d7b93d4f7cec0633bee2ede344e97c476f34eecba4b22f3066dc1a9badba137  /tmp/repeatzero.zip" | sha256sum -c -
          unzip -q /tmp/repeatzero.zip -d /tmp/repeatzero-src
          test -f /tmp/repeatzero-src/ZenixRepeatZero/app/build.gradle

      - name: Gradle environment
        working-directory: /tmp/repeatzero-src/ZenixRepeatZero
        run: |
          java -version
          gradle --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -80

      - name: Compile debug APK
        working-directory: /tmp/repeatzero-src/ZenixRepeatZero
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Android lint
        working-directory: /tmp/repeatzero-src/ZenixRepeatZero
        run: gradle lintDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -e
          APK=/tmp/repeatzero-src/ZenixRepeatZero/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RepeatZero-debug-apk
          path: /tmp/repeatzero-src/ZenixRepeatZero/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint/build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RepeatZero-build-reports
          path: |
            /tmp/repeatzero-src/ZenixRepeatZero/app/build/reports
            /tmp/repeatzero-src/ZenixRepeatZero/app/build/outputs/logs
          if-no-files-found: ignore
          retention-days: 14
