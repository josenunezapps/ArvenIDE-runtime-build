name: RepeatZero Functional Lab

on:
  push:
    branches:
      - repeatzero-ci
    paths:
      - '.github/workflows/repeatzero-functional.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional:
    name: Emulator functional test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct exact RepeatZero source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            repeatzero/chunk_00.b64 \
            repeatzero/chunk_01.b64 \
            repeatzero/chunk_02.b64 \
            repeatzero/chunk_03.b64 \
            repeatzero/chunk_04.b64 \
            repeatzero/chunk_05_0.b64 \
            repeatzero/chunk_05_1.b64 \
            repeatzero/chunk_05_2.b64 \
            repeatzero/chunk_05_3.b64 \
            repeatzero/chunk_05_4.b64 \
            repeatzero/chunk_06.b64 > /tmp/repeatzero.b64
          echo "245f7805b17bf193966c324cfd50da84868ec9383be72800a21cf958c4cb6988  /tmp/repeatzero.b64" | sha256sum -c -
          base64 -d /tmp/repeatzero.b64 > /tmp/repeatzero.zip
          echo "2d7b93d4f7cec0633bee2ede344e97c476f34eecba4b22f3066dc1a9badba137  /tmp/repeatzero.zip" | sha256sum -c -
          unzip -q /tmp/repeatzero.zip -d /tmp/repeatzero-src
          test -f /tmp/repeatzero-src/ZenixRepeatZero/app/build.gradle

      - name: Inject test-only instrumentation
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/repeatzero-src/ZenixRepeatZero
          mkdir -p "$ROOT/app/src/androidTest/java/com/zenix/repeatzero/test"
          mkdir -p "$ROOT/app/src/androidTest/java/com/zenix/repeatzero"
          mkdir -p "$ROOT/app/src/androidTest/res/values"
          cp .ci-repeatzero-tests/AndroidManifest.xml "$ROOT/app/src/androidTest/AndroidManifest.xml"
          cp .ci-repeatzero-tests/TargetActivity.java "$ROOT/app/src/androidTest/java/com/zenix/repeatzero/test/TargetActivity.java"
          cp .ci-repeatzero-tests/RepeatZeroInstrumentedTest.java "$ROOT/app/src/androidTest/java/com/zenix/repeatzero/RepeatZeroInstrumentedTest.java"
          cp .ci-repeatzero-tests/ids.xml "$ROOT/app/src/androidTest/res/values/ids.xml"

          sed -i "/versionName '1.0.0'/a\\        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'" "$ROOT/app/build.gradle"
          sed -i "/material:material:1.12.0'/a\\    androidTestImplementation 'androidx.test:runner:1.6.2'\n    androidTestImplementation 'androidx.test.ext:junit:1.2.1'\n    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'" "$ROOT/app/build.gradle"

      - name: Privacy/static assertions
        shell: bash
        working-directory: /tmp/repeatzero-src/ZenixRepeatZero
        run: |
          set -euo pipefail
          ! grep -R "android.permission.INTERNET" app/src/main
          ! grep -R -E "MediaProjection|takeScreenshot|ACTION_SET_TEXT" app/src/main/java
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'source.isPassword()' app/src/main/java/com/zenix/repeatzero/service/RepeatZeroAccessibilityService.java

      - name: Compile production and test APKs
        shell: bash
        working-directory: /tmp/repeatzero-src/ZenixRepeatZero
        run: gradle clean assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Run full Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd /tmp/repeatzero-src/ZenixRepeatZero
            mkdir -p app/build/reports/androidTests
            set +e
            gradle connectedDebugAndroidTest --stacktrace --no-daemon
            RESULT=$?
            adb logcat -d > app/build/reports/androidTests/emulator-logcat.txt 2>&1 || true
            adb shell dumpsys accessibility > app/build/reports/androidTests/accessibility-dumpsys.txt 2>&1 || true
            exit $RESULT

      - name: Upload functional reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RepeatZero-functional-reports
          path: |
            /tmp/repeatzero-src/ZenixRepeatZero/app/build/reports
            /tmp/repeatzero-src/ZenixRepeatZero/app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 14
