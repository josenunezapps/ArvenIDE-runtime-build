name: Build Arven JDK 17

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-arven-jdk17.yml
      - tools/arven-jdk/**

permissions:
  contents: write

jobs:
  build-jdk17-aarch64:
    name: Arven JDK 17 · arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:
      - name: Checkout Arven
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          docker system prune -af || true
          df -h

      - name: Build Arven-specific JDK 17 runtime
        run: |
          chmod +x tools/arven-jdk/build-arven-jdk17.sh
          tools/arven-jdk/build-arven-jdk17.sh aarch64 "$GITHUB_WORKSPACE/.arven-jdk-build"

      - name: Show artifact info
        run: |
          ls -lh .arven-jdk-build/output/
          cat .arven-jdk-build/output/build-info.txt
          cat .arven-jdk-build/output/arven-jdk17-aarch64.zip.sha256

      - name: Upload Arven JDK 17
        uses: actions/upload-artifact@v4
        with:
          name: arven-jdk17-aarch64
          path: |
            .arven-jdk-build/output/arven-jdk17-aarch64.zip
            .arven-jdk-build/output/arven-jdk17-aarch64.zip.sha256
            .arven-jdk-build/output/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="arven-jdk17-runtime"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Arven JDK 17 Runtime" \
              --notes "Runtime JDK 17 arm64 generado para Arven IDE. Los archivos de esta Release permanecen disponibles aunque venza el artifact temporal de GitHub Actions."
          fi

          gh release upload "$TAG" \
            .arven-jdk-build/output/arven-jdk17-aarch64.zip \
            .arven-jdk-build/output/arven-jdk17-aarch64.zip.sha256 \
            .arven-jdk-build/output/build-info.txt \
            --clobber
